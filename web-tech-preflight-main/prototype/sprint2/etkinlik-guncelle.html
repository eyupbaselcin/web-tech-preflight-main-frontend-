<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle</title>
  <link rel="stylesheet" href="css/2416501049.css">
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="etkinlikler.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <main>
    <form>
      <label for="ad">Etkinlik Adı</label>
      <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>

      <label for="kategori">Kategori</label>
      <select id="kategori" name="kategori">
        <option value="seminer" selected>Seminer</option>
        <option value="atolye">Atölye</option>
        <option value="konferans">Konferans</option>
        <option value="sosyal">Sosyal</option>
      </select>

      <label for="tarih">Tarih / Saat</label>
      <input type="datetime-local" id="tarih" name="tarih" value="2026-10-12T14:00" required>

      <label for="aciklama">Açıklama</label>
      <textarea id="aciklama" name="aciklama" rows="5">Kariyer Günleri 2026 etkinliği A Blok Konferans Salonu'nda gerçekleştirilecektir.</textarea>

      <button type="submit">Güncelle</button>
    </form>
  </main>

  <footer>
    <p>Eyüp - Başelçin - 2416501043</p>
  </footer>
</body>
</html>
